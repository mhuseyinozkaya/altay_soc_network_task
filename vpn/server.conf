port 1194
proto udp
dev tun

ca /etc/openvpn/pki/ca.crt
cert /etc/openvpn/pki/issued/server.crt
key /etc/openvpn/pki/private/server.key
dh /etc/openvpn/pki/dh.pem

# VPN istemcilerine bu aralıktan IP verilir (DMZ subnetinin bir parçası
# değil, ayrı bir tünel havuzu -> istemciler VPN üzerinden DMZ'ye düşer)
server 10.8.0.0 255.255.255.0

# İstemci, DMZ ağını (192.168.100.0/24) VPN üzerinden görebilsin
push "route 192.168.100.0 255.255.255.0"

keepalive 10 120
persist-key
persist-tun

# Kimlik doğrulama: sertifika + FreeRADIUS'a client-connect script ile devredilecek
verify-client-cert require
script-security 2
client-connect /etc/openvpn/client-connect.sh

status /var/log/openvpn/status.log
verb 3
