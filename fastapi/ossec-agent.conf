<ossec_config>
  <client>
    <server>
      <address>MANAGER_IP</address>
      <port>1514</port>
      <protocol>udp</protocol>
    </server>
    <config-profile>fastapi</config-profile>
  </client>

  <!-- Policy Engine kararlari (success/failure/blocked/rate_limited) -
       AŞAMA 3'teki tespit zincirinin asil kaynagi burasi. -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/soc/auth_events.log</location>
  </localfile>

  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>
